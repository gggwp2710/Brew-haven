<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Haven | Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>
            <h1 class="logo"> <a href="index.html"><img src="img/icon.png" alt="Brew Haven Logo"></a></h1>
            <h1 class="logo-text">Contact Us</h1>
            
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Info -->
    <section class="contact">
        <h2>Visit Us</h2>

        <p><strong>Location:</strong> Edinburgh City Centre</p>
        <p><strong>Opening Hours:</strong> Mon - Sun, 8:00am - 6:00pm</p>
        <p><strong>Email:</strong> info@brewhaven.com</p>
    </section>

    <!-- Contact Form -->
    <section class="contact-form">
        <h2>Send Us a Message</h2>

        <form action="mailto:info@brewhaven.com" method="post" enctype="text/plain">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br>
            
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>
            
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br>
            <input type="submit" value="Send">

        </form>
    </section>

    <!-- Map -->
    <section class="map">
        <h2>Find Us</h2>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2400.1477150867586!2d-3.10110428756064!3d55.94383707714882!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4887b9a7365fccff%3A0x52629bc613f4b94b!2sEdinburgh%20College!5e1!3m2!1szh-TW!2suk!4v1777728877207!5m2!1szh-TW!2suk" 
        width="400" 
        height="300" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </section>

</body>
</html>
